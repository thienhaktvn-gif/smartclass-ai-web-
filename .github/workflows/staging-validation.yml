name: Safe staging validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: sanggiao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d sanggiao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Database isolation regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: PostgreSQL integration test
        env:
          SANGGIAO_TEST_POSTGRES_URL: postgresql://testuser:testpass@localhost:5432/sanggiao_test
        run: python -m unittest discover -s tests -p 'test_postgres_integration.py' -v
      - name: HTTP teacher signup test
        env:
          SANGGIAO_TEST_POSTGRES_URL: postgresql://testuser:testpass@localhost:5432/sanggiao_test
        run: python -m unittest discover -s tests -p 'test_signup_http.py' -v
      - name: JavaScript syntax
        run: |
          node --check question-pages.js
          node --check accounts.js
      - name: Check route contract
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('app.py').read_text(encoding='utf-8')
          assert "if p=='/api/questions/page':" in code
          assert "if p=='/api/questions':" in code
          assert 'LIMIT ? OFFSET ?' in code
          assert 'question-pages.js' in Path('index.html').read_text(encoding='utf-8')
          PY
