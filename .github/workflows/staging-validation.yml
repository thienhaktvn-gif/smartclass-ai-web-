name: Safe staging validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile app.py
      - name: JavaScript syntax
        run: node --check question-pages.js
      - name: Check route contract
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('app.py').read_text(encoding='utf-8')
          assert "if p=='/api/questions/page':" in code
          assert "if p=='/api/questions':" in code
          assert 'LIMIT ? OFFSET ?' in code
          assert 'question-pages.js' in Path('index.html').read_text(encoding='utf-8')
          PY
